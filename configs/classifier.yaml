# Класифікатор кропів диска: glaucoma (скринінг, повнота ~100 %) + valid_image (відсів хибних виявлень).
# Запуск:  python -m neuromed compress --config configs/classifier.yaml
name: classifier
output_dir: runs
seed: 42
device: auto

data:
  datasets:
    - data/processed/papila
    - data/processed/acrima
    - data/processed/zenodo_dg
  input_size: 128
  batch_size: 32
  val_fraction: 0.15
  test_fraction: 0.15
  chunks: 5
  epoch_strategy: kfold
  preprocess:
    hsv_s_equalize: true
    clahe: true
    clahe_clip: 2.0
    clahe_grid: 8
    grayscale: false              # колір диска (блідість) важливий для глаукоми
  augment:
    rotate_deg: 20
    shear_deg: 6
    saturation: 0.1
  hard_examples:
    enabled: true
    replay_prob: 0.5

model:
  type: classifier
  base: 64
  pretrained: true
  labels: [glaucoma, valid_image]   # перша мітка — головна (за нею звіт і «крайні випадки»)
  hidden_mult: 2

loss:
  pos_weight: 1.0
  neg_weight: 1.0
  label_pos_weight:
    glaucoma: 2.0                 # пропущена хвороба гірша за хибну тривогу

train:
  max_epochs: 60
  min_epochs: 10
  lr: 1.0e-4
  freeze_transferred_epochs: 2
  patience: 10
  target:
    glaucoma_auc: 0.90
    valid_image_f1: 0.97
  selection: [glaucoma_auc, valid_image_f1]

compress:
  prune_ratio: 0.5
  min_prune_ratio: 0.125
  retry_smaller_ratio: true
  min_channels: 4
  max_iterations: 8
  spread_epochs: 6
  squeeze_epochs: 12
  norm_max: 0.95
  norm_method: both
  lr_scale_after_cut: 0.5
  stabilize_min_epochs: 4
  stabilize_max_epochs: 30
  stabilize_patience: 6
  acceptance:
    minimum:
      glaucoma_recall: 0.90
    max_drop:
      glaucoma_auc: 0.03
      glaucoma_specificity: 0.10    # при порозі, що дає повноту 95 %
      valid_image_f1: 0.03

distill:
  enabled: false
  alpha: 0.5
  temperature: 2.0

eval:
  threshold: 0.5
  calibrate_recall:
    glaucoma: 0.95                # поріг підбирається на контрольній вибірці під повноту 95 %
  edge_cases: 10
  benchmark_threads: 4
  benchmark_runs: 20
